<!DOCTYPE html>
<html>
<head>
  <title>U10 Match Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f4f4;
    }

    h2 {
      margin-top: 10px;
    }

    .player {
      margin: 10px;
    }

    button {
      font-size: 18px;
      margin: 5px;
      padding: 15px;
      width: 140px;
      border-radius: 10px;
      border: none;
    }

    .goal {
      background-color: #4CAF50;
      color: white;
    }

    .assist {
      background-color: #2196F3;
      color: white;
    }

    #undo {
      background-color: #f44336;
      color: white;
      margin-top: 15px;
    }

    ul {
      text-align: left;
      max-width: 400px;
      margin: auto;
      padding: 0;
    }

    li {
      list-style: none;
      background: white;
      margin: 5px;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>U10 Match Tracker ⚽</h2>

<div id="players"></div>

<button id="undo" onclick="undoLast()">Undo Last</button>

<h3>Match Events</h3>
<ul id="log"></ul>

<script>
const players = [
  "Riley","Jasper","Harry","Noah","Ozzie","Reuben","Arthur","Jos","Marko",
  "Seb","Zac","Dom","Cole","Remi","Miracle","OG","Marcel","Danny","Luke","E-Man"
];

const log = [];

const container = document.getElementById("players");

players.forEach(player => {
  const div = document.createElement("div");
  div.className = "player";

  const goalBtn = document.createElement("button");
  goalBtn.innerText = player + " ⚽";
  goalBtn.className = "goal";
  goalBtn.onclick = () => addEvent(player, "Goal");

  const assistBtn = document.createElement("button");
  assistBtn.innerText = player + " 🎯";
  assistBtn.className = "assist";
  assistBtn.onclick = () => addEvent(player, "Assist");

  div.appendChild(goalBtn);
  div.appendChild(assistBtn);
  container.appendChild(div);
});

function addEvent(player, type) {
  const time = new Date().toLocaleTimeString();
  const entry = `${time} - ${player} (${type})`;
  log.push(entry);

  const li = document.createElement("li");
  li.innerText = entry;
  document.getElementById("log").appendChild(li);
}

function undoLast() {
  log.pop();
  const list = document.getElementById("log");
  list.removeChild(list.lastChild);
}
</script>

</body>
</html>
